spring.application.name=erfolg-zentrum
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/erfolg-zentrum;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.docker.compose.enabled=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.security.csrf-cookie.same-site=${CSRF_COOKIE_SAME_SITE:lax}
app.security.csrf-cookie.secure=${CSRF_COOKIE_SECURE:false}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:}
app.admin.username=${ADMIN_USERNAME:admin}
app.enrollment.opens-on=${APP_ENROLLMENT_OPENS_ON:}
app.enrollment.opening-margin-days=${APP_ENROLLMENT_OPENING_MARGIN_DAYS:25}
app.admin.password=${ADMIN_PASSWORD:}
app.mail.from=${MAIL_FROM:no-reply@erfolgzentrum.com}
